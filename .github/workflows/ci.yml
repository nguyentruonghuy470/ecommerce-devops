name: CI - Ecommerce

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: ./mvnw test

      - name: Build application
        run: ./mvnw clean package -DskipTests


  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build


  kubernetes:
    name: Kubernetes Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install kubeconform
        run: |
          curl -L \
            -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz

          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform

          sudo install /tmp/kubeconform /usr/local/bin/kubeconform

          kubeconform -v

      - name: Validate Kubernetes manifests
        run: |
          kubeconform \
            -strict \
            -summary \
            -ignore-missing-schemas \
            k8s/namespace.yaml \
            k8s/backend/deployment.yaml \
            k8s/backend/service.yaml \
            k8s/backend/configmap.yaml \
            k8s/frontend/deployment.yaml \
            k8s/frontend/service.yaml \
            k8s/ingress/frontend-ingress.yaml \
            k8s/ingress/backend-ingress.yaml \
            k8s/autoscaling/backend-hpa.yaml \
            k8s/storage/pvc.yaml \
            k8s/redis/pvc.yaml \
            k8s/redis/service.yaml \
            k8s/redis/headless-service.yaml
